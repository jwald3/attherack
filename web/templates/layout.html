{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>At The Rack{{if .PageTitle}} — {{.PageTitle}}{{end}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">{{icon "dumbbell"}}</span>
      <span class="brand-name">At The Rack</span>
    </div>
    <nav class="tabs">
      <a href="/" class="tab {{if eq .Active "coach"}}active{{end}}">Coach</a>
      <a href="/training" class="tab {{if eq .Active "training"}}active{{end}}">Training</a>
      <a href="/programs" class="tab {{if eq .Active "programs"}}active{{end}}">Programs</a>
      <a href="/cardio" class="tab {{if eq .Active "cardio"}}active{{end}}">Cardio</a>
      <a href="/bodyweight" class="tab {{if eq .Active "bodyweight"}}active{{end}}">Bodyweight</a>
      <a href="/progress" class="tab {{if eq .Active "progress"}}active{{end}}">Progress</a>
      <a href="/diet" class="tab {{if eq .Active "diet"}}active{{end}}">Diet</a>
      <a href="/supplements" class="tab {{if eq .Active "supplements"}}active{{end}}">Supplements</a>
    </nav>
    <div class="topbar-sub">today {{.Today}}</div>
  </header>
{{end}}

{{define "foot"}}
</body>
</html>
{{end}}
