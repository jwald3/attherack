name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's hard or impossible today?
      placeholder: I want to track ... but there's no way to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you're using now, or other approaches you thought about.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Keep in mind
      description: At The Rack aims to stay a small, single-binary, self-hosted app.
      options:
        - label: This fits an app with no build step and a minimal dependency footprint.
          required: false
